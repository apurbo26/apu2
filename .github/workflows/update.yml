name: Auto Update M3U Playlist

on:
  schedule:
    # প্রতি ৩০ মিনিট পর পর অটোমেটিক রান করার জন্য
    - cron: '*/30 * * * *'
  # ম্যানুয়ালি রান করার অপশন
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Run M3U Fetcher Script
      run: php fetch.php

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist [cron]" && git push)
        
